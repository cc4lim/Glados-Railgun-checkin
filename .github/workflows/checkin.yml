name: GLaDOS Auto Checkin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # 允许你在网页上手动点击运行测试
  schedule:
    # 每天国际标准时间 01:00（北京时间上午 09:00）自动运行
    - cron: '0 1 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install requests

    - name: Run checkin script
      env:
        # 注意：这里已完美匹配你截图中的 GLADOS_COOKIES
        COOKIE: ${{ secrets.GLADOS_COOKIES }}
      run: |
        sed -i "s|MY_COOKIE = \".*\"|MY_COOKIE = \"$COOKIE\"|g" glados.py
        python glados.py
